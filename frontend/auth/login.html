<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deepsync | Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left-panel">
      <h1 class="app-name">Deepsync</h1>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
      <h2>Sign In</h2>

      <input type="email" placeholder="Enter your email">
      <input type="password" placeholder="Enter your password">

      <button>Continue</button>

      <p class="signup">New user? Create account</p>
    </div>

  </div>

</body>
</html>
